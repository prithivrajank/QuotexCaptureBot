services:
  - type: web
    name: quotex-capture-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: INGEST_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: data
      - key: SIGNALS_ENABLED
        value: false
